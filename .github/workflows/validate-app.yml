name: Validate WIRED JavaScript
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - ".github/workflows/validate-app.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app.js syntax
        run: node --check app.js
