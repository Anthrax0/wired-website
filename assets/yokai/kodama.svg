<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Animated Kodama forest spirit">
<style>
.spirit{transform-origin:96px 110px;animation:float 2.8s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.flame{transform-box:fill-box;transform-origin:center;animation:flicker 1.2s ease-in-out infinite alternate}
.flame.b{animation-delay:-.55s}
.glow{animation:pulse 2s ease-in-out infinite alternate}
@keyframes float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes flicker{from{transform:translateY(2px) scale(.92) rotate(-5deg)}to{transform:translateY(-3px) scale(1.08) rotate(5deg)}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.spirit,.eye,.flame,.glow{animation:none}}
</style>
<defs>
 <radialGradient id="head" cx="35%" cy="25%"><stop stop-color="#fffef5"/><stop offset=".72" stop-color="#eeeef4"/><stop offset="1" stop-color="#b8b5ce"/></radialGradient>
 <linearGradient id="body" x2="0" y2="1"><stop stop-color="#fffdf3"/><stop offset="1" stop-color="#c9c5dc"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#35ffe2" stop-opacity=".48"/><stop offset="1" stop-color="#35ffe2" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
 </defs>
 <ellipse cx="96" cy="166" rx="42" ry="8" fill="#1c102b" opacity=".22"/>
 <g class="glow"><ellipse cx="35" cy="94" rx="27" ry="34" fill="url(#aura)"/><ellipse cx="158" cy="80" rx="25" ry="33" fill="url(#aura)"/></g>
 <g class="flame" transform="translate(35 83)"><path d="M0 20C-18 8-5-3 1-21 8-8 19 0 12 13 9 20 4 23 0 20Z" fill="#35f5d8" opacity=".25" filter="url(#blur)"/><path d="M0 20C-15 10-4 1 1-16 8-5 16 3 10 14 7 20 3 22 0 20Z" fill="#42ffe3" stroke="#12a996" stroke-width="2"/><path d="M1 15C-5 8 1 4 3-3 8 5 9 10 5 15Z" fill="#effffb"/></g>
 <g class="flame b" transform="translate(158 70)"><path d="M0 20C-18 8-5-3 1-21 8-8 19 0 12 13 9 20 4 23 0 20Z" fill="#35f5d8" opacity=".25" filter="url(#blur)"/><path d="M0 20C-15 10-4 1 1-16 8-5 16 3 10 14 7 20 3 22 0 20Z" fill="#42ffe3" stroke="#12a996" stroke-width="2"/><path d="M1 15C-5 8 1 4 3-3 8 5 9 10 5 15Z" fill="#effffb"/></g>
 <g class="spirit">
  <path d="M75 115Q60 130 66 150Q71 159 82 151L93 137 106 137 118 152Q129 158 132 148Q137 129 119 114Z" fill="url(#body)" stroke="#17131e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M73 122Q59 126 57 140Q56 147 63 148Q72 146 79 135M118 122Q134 125 136 139Q137 147 130 148Q121 145 115 135" fill="none" stroke="#17131e" stroke-width="5" stroke-linecap="round"/>
  <path d="M83 149Q78 163 77 168Q83 174 91 168L96 150M104 150Q110 163 111 168Q105 174 98 168" fill="none" stroke="#17131e" stroke-width="6" stroke-linecap="round"/>
  <path d="M83 149Q78 163 77 168Q83 174 91 168L96 150M104 150Q110 163 111 168Q105 174 98 168" fill="none" stroke="#d8d4e6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96 25C130 25 151 49 151 83C151 111 128 128 96 128C64 128 41 111 41 83C41 49 62 25 96 25Z" fill="url(#head)" stroke="#17131e" stroke-width="4"/>
  <path d="M64 43Q78 33 91 36M106 36Q122 33 133 44" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
  <g class="eye"><ellipse cx="73" cy="81" rx="11" ry="17" fill="#090811"/></g><g class="eye"><ellipse cx="119" cy="81" rx="11" ry="17" fill="#090811"/></g>
  <ellipse cx="96" cy="105" rx="3.5" ry="2.8" fill="#090811"/>
  <path d="M59 56Q64 47 70 44M124 44Q132 47 136 56" fill="none" stroke="#d2cfdf" stroke-width="2" opacity=".8"/>
  <path d="M85 117Q96 123 107 117" fill="none" stroke="#c5bfd5" stroke-width="2" opacity=".6"/>
 </g>
</svg>